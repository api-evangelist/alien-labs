aid: alien-labs
name: Alien Labs
description: >-
  Alien Labs, Inc. was a San Francisco software startup founded by Cristian Strat, Mircea Pasoi
  and Liana Dumitru, and a seed-stage portfolio company of Bloomberg Beta. Under the Alien Labs
  banner the team shipped Summify, a social news digest acquired by Twitter in January 2012, and
  later Memo — "the wiki that's always up-to-date" — a Slack-native team knowledge base that let
  8,000+ teams star a Slack message to save it as a searchable note, edit rich-text and code-block
  documents in context, and retrieve them with a /memo-find slash command. Memo stopped accepting
  new signups on January 16, 2018 and shut down on March 16, 2018; most of the engineering team
  joined Coinbase. The company operates no live developer portal, documentation, or public API
  today, and this profile is retained as a historical network record rather than an active API
  provider.
